[package]
name = "voiceon-core"
version.workspace = true
edition.workspace = true
publish = false

# Платформонезависимая часть клиента: сеть, jitter buffer, микшер, конвейер
# передачи (RNNoise → VAD → Opus) и проверка подписи релизов. Общая для
# десктопа (client) и Android (ffi).
[dependencies]
voiceon-proto = { path = "../proto" }
getrandom = "0.2"
opus = "0.4"
nnnoiseless = "0.5"
sha2 = "0.10"
ed25519-dalek = "2"
