[package]
name = "voiceon"
version.workspace = true
edition.workspace = true

[dependencies]
voiceon-proto = { path = "../proto" }
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "6"
opus = "0.4"
cpal = "0.18"
nnnoiseless = "0.5"
ringbuf = "0.4"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "wayland", "x11", "clipboard"] }
ureq = "3"
serde_json = "1"
sha2 = "0.10"
ed25519-dalek = "2"
self-replace = "1"
egui-phosphor = { version = "0.14", default-features = false, features = ["regular"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Трей через StatusNotifierItem по D-Bus, без GTK; лёгкий исполнитель async-io вместо tokio.
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
# Тот же winit, что внутри eframe: нужен, чтобы попросить X11-бэкенд.
winit = { version = "0.30", default-features = false, features = ["x11"] }

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.26", default-features = false }
mslnk = "0.1"
winreg = "0.56"

[build-dependencies]
winresource = "0.1"
